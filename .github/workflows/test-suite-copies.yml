name: Test suite copies

on:
  pull_request:
    branches:
      - main
      - master
      # ESR branches glob pattern
      - "[0-9]+.[0-9]+.x"

permissions:
  contents: read

jobs:
  identical:
    name: Shared suite files are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # Leviathan uploads one suite directory, so each suite carries a copy
      - name: Compare the cloud and hup copies
        working-directory: tests/suites
        run: |
          for shared in lib/extensions-common.js assets/crc-gate; do
            git diff --no-index --exit-code "cloud/$shared" "hup/$shared"
          done
