name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - "main"
      - "master"
      - '[0-9]+.[0-9]+.x'
  push:
    branches: [main, master, "[0-9]+.[0-9]+.x"]

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.2
    secrets: inherit
    with:
      cloudflare_website: "balena-os"
