# BPF LSM + BTF + tracing/observability

# BTF needs full DWARF
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
# Not settable directly; kept so do_kernel_balena_verify_fragments asserts it
# survived the merge.
CONFIG_DEBUG_INFO=y
# CONFIG_DEBUG_INFO_NONE is not set
# CONFIG_DEBUG_INFO_REDUCED is not set
CONFIG_DEBUG_INFO_BTF=y

# BPF core.
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_LSM=y
# CONFIG_LSM is deliberately absent: it is a whole-list value, so a fragment
# can only replace the device's list and drop every other LSM. Every kconfig
# default ends in "bpf"; do_kernel_ebpf_verify_lsm asserts it rather than
# assuming it.

# Tracing surface for observability.
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_PERF_EVENTS=y
CONFIG_BPF_EVENTS=y
