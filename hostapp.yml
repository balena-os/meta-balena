# yaml-language-server: $schema=https://raw.githubusercontent.com/balena-os/balena-yocto-scripts/refs/heads/master/schemas/hostapp-composition.json
version: '2.4'
# Every service must set network_mode, or compose-go injects a `default` network into the
# published composition and the supervisor creates a real bridge for it, whose auto-assigned
# subnet can collide with the device's LAN. Declaring `networks: {}` does not suppress it.
services:

  hostapp:
    image: __BUILD_OUTPUT__
    network_mode: none
    x-build:
      assets:
        - "images/__MACHINE__/VERSION"
        - "images/__MACHINE__/VERSION_HOSTOS"
        - "images/__MACHINE__/image*.json"
        - "images/__MACHINE__/compressed*/part-*.deflate"
        - "images/__MACHINE__/*.manifest"
        - "images/__MACHINE__/kernel_modules_headers.tar.gz"
        - "images/__MACHINE__/rpi-eeprom/secure-boot-lock/"
        - "cyclonedx-export/**/*.json"
        - "licenses/**"
    labels:
      io.balena.image.store: 'root'
      io.balena.image.class: 'hostapp'
      io.balena.update.requires-reboot: '1'
      io.balena.private.hostapp.board-rev: '__DEVICE_REPO_REV__'
